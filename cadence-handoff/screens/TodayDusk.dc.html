<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today, Dusk</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cadence.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px">
<dc-import name="Main" palette="{{palette}}" theme="light" start-done="{{done}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["meadow","ultramarine","dusk","rose","lagoon","graphite"],"default":"dusk","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { palette: this.props.palette ?? 'dusk', done: 5 };
}
}
</script>
</body>
</html>
