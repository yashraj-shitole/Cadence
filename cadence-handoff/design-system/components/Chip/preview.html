<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}.cd-stage{min-height:100%;padding:24px 20px;display:grid;align-content:center}</style></head><body><main class="cd-stage"><i class="cd-glow cd-glow--1" style="width:300px;height:240px;right:-60px;top:-70px"></i><i class="cd-glow cd-glow--3" style="width:240px;height:200px;left:-70px;top:34%"></i><i class="cd-glow cd-glow--2" style="width:320px;height:260px;left:10%;bottom:-110px"></i><div style="width:100%;max-width:390px;margin:0 auto;display:grid;gap:12px"><div class="cd-chips"><button class="cd-chip is-on">All</button><button class="cd-chip">Work</button><button class="cd-chip">Home</button><button class="cd-chip">Health</button></div><div class="cd-glass" style="padding:16px;display:flex;gap:8px;align-items:center"><span class="cd-tag">Work</span><span class="cd-tag">Home</span><span class="cd-tag"><svg class="cd-icon cd-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>5:30 pm</span></div></div></main><script>const cs=[...document.querySelectorAll('.cd-chip')];cs.forEach(c=>c.onclick=()=>{cs.forEach(x=>x.classList.remove('is-on'));c.classList.add('is-on')})</script></body></html>
