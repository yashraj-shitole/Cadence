<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}.cd-stage{min-height:100%;padding:24px 20px;display:grid;align-content:center}</style></head><body><main class="cd-stage"><i class="cd-glow cd-glow--1" style="width:300px;height:240px;right:-60px;top:-70px"></i><i class="cd-glow cd-glow--3" style="width:240px;height:200px;left:-70px;top:34%"></i><i class="cd-glow cd-glow--2" style="width:320px;height:260px;left:10%;bottom:-110px"></i><div style="width:100%;max-width:390px;margin:0 auto;display:grid;gap:12px"><div class="cd-row cd-glass cd-press "><button class="cd-check " aria-label="Log Read 10 pages"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></i></button><div class="cd-row__body"><div class="cd-row__title">Read 10 pages</div><div class="cd-row__sub">After chai, on the balcony</div><div class="cd-row__meta"><span>Minimum: 1 page</span></div></div><div class="cd-row__side"><div class="cd-week" role="img" aria-label="Last 7 days: done, done, rest day, done, missed, done, today, open"><i class="cd-dot cd-dot--done"></i><i class="cd-dot cd-dot--done"></i><i class="cd-dot cd-dot--rest"></i><i class="cd-dot cd-dot--done"></i><i class="cd-dot cd-dot--miss"></i><i class="cd-dot cd-dot--done"></i><i class="cd-dot cd-dot--today"></i></div><span class="cd-streak"><b>12</b> day streak</span></div></div><div class="cd-row cd-glass cd-press is-done"><button class="cd-check " aria-label="Log Stretch"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></i></button><div class="cd-row__body"><div class="cd-row__title">Stretch</div><div class="cd-row__sub">Before the first meeting</div><div class="cd-row__meta"><span>Minimum: 2 minutes</span></div></div><div class="cd-row__side"><div class="cd-week" role="img" aria-label="Last 7 days: done, minimum, done, done, rest day, done, done"><i class="cd-dot cd-dot--done"></i><i class="cd-dot cd-dot--min"></i><i class="cd-dot cd-dot--done"></i><i class="cd-dot cd-dot--done"></i><i class="cd-dot cd-dot--rest"></i><i class="cd-dot cd-dot--done"></i><i class="cd-dot cd-dot--done"></i></div><span class="cd-streak"><b>31</b> day streak</span></div></div></div></main><script>document.querySelectorAll('.cd-check').forEach(b=>b.addEventListener('click',()=>{(b.closest('.cd-row')||b).classList.toggle('is-done')}));</script></body></html>
