<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}.cd-stage{min-height:100%;padding:24px 20px;display:grid;align-content:center}</style></head><body><main class="cd-stage"><i class="cd-glow cd-glow--1" style="width:300px;height:240px;right:-60px;top:-70px"></i><i class="cd-glow cd-glow--3" style="width:240px;height:200px;left:-70px;top:34%"></i><i class="cd-glow cd-glow--2" style="width:320px;height:260px;left:10%;bottom:-110px"></i><div style="width:100%;max-width:390px;margin:0 auto;display:grid;gap:12px"><div class="cd-glass cd-group"><div class="cd-setting"><div class="cd-setting__body"><div class="cd-setting__title">Weekend rest days</div><div class="cd-setting__sub">Sat and Sun keep every streak</div></div><button class="cd-toggle" role="switch" aria-checked="true" aria-label="Weekend rest days"></button></div></div></div></main><script>document.querySelectorAll('.cd-toggle').forEach(t=>t.addEventListener('click',()=>t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true')));</script></body></html>
