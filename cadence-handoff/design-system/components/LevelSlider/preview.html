<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}.cd-stage{min-height:100%;padding:24px 20px;display:grid;align-content:center}</style></head><body><main class="cd-stage"><i class="cd-glow cd-glow--1" style="width:300px;height:240px;right:-60px;top:-70px"></i><i class="cd-glow cd-glow--3" style="width:240px;height:200px;left:-70px;top:34%"></i><i class="cd-glow cd-glow--2" style="width:320px;height:260px;left:10%;bottom:-110px"></i><div style="width:100%;max-width:390px;margin:0 auto;display:grid;gap:12px"><div class="cd-glass cd-group"><div class="cd-setting--stack"><div class="cd-setting__title">Motion</div><div data-sets="motion" data-vals="off,subtle,standard,expressive" class="lv"><div class="cd-level" style="--v:2"><div class="cd-level__track"><i class="cd-level__fill"></i><div class="cd-level__stops"><i></i><i></i><i></i><i></i></div><i class="cd-level__thumb"></i><input type="range" min="0" max="3" step="1" value="2" aria-label="Motion intensity"></div><div class="cd-level__labels"><span class="">Off</span><span class="">Subtle</span><span class="is-on">Standard</span><span class="">Expressive</span></div></div></div></div><div class="cd-setting--stack"><div class="cd-setting__title">Haptics</div><div class="cd-level" style="--v:2"><div class="cd-level__track"><i class="cd-level__fill"></i><div class="cd-level__stops"><i></i><i></i><i></i><i></i></div><i class="cd-level__thumb"></i><input type="range" min="0" max="3" step="1" value="2" aria-label="Haptic intensity"></div><div class="cd-level__labels"><span class="">Off</span><span class="">Soft</span><span class="is-on">Balanced</span><span class="">Firm</span></div></div></div></div></div></main><script>document.querySelectorAll('.lv').forEach(w=>{const l=w.querySelector('.cd-level');l.dataset.sets=w.dataset.sets;l.dataset.vals=w.dataset.vals});document.querySelectorAll('.cd-level').forEach(l=>{const r=l.querySelector('input'),ls=[...l.querySelectorAll('.cd-level__labels span')];r.addEventListener('input',()=>{l.style.setProperty('--v',r.value);ls.forEach((x,i)=>x.classList.toggle('is-on',i==r.value));if(l.dataset.sets)document.documentElement.dataset[l.dataset.sets]=l.dataset.vals.split(',')[r.value]})});</script></body></html>
