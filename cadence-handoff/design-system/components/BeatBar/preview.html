<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}.cd-stage{min-height:100%;padding:24px 20px;display:grid;align-content:center}</style></head><body><main class="cd-stage"><i class="cd-glow cd-glow--1" style="width:300px;height:240px;right:-60px;top:-70px"></i><i class="cd-glow cd-glow--3" style="width:240px;height:200px;left:-70px;top:34%"></i><i class="cd-glow cd-glow--2" style="width:320px;height:260px;left:10%;bottom:-110px"></i><div style="width:100%;max-width:390px;margin:0 auto;display:grid;gap:12px"><div><div class="cd-progress"><b>4/8<small>beats done</small></b><span>4 to go</span></div><div class="cd-beats" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="4" aria-label="4 of 8 beats done"><i class="cd-beat is-done"></i><i class="cd-beat is-done"></i><i class="cd-beat is-done"></i><i class="cd-beat is-done"></i><i class="cd-beat"></i><i class="cd-beat"></i><i class="cd-beat"></i><i class="cd-beat"></i></div></div><div style="display:flex;gap:12px"><button class="cd-btn cd-btn--glass cd-press" id="add">Complete one</button><button class="cd-btn cd-btn--quiet" id="rst">Reset</button></div></div></main><script>const bs=[...document.querySelectorAll('.cd-beat')],n=document.querySelector('.cd-progress b'),t=document.querySelector('.cd-progress span');let d=4;function r(){bs.forEach((b,i)=>b.classList.toggle('is-done',i<d));n.firstChild.textContent=d+'/8';t.textContent=d==8?'All done':(8-d)+' to go'}add.onclick=()=>{d=Math.min(8,d+1);r()};rst.onclick=()=>{d=0;r()}</script></body></html>
